# Runs every Tuesday morning, after Monday Night Football has finished, so
# the previous week's games are fully in the books before this pulls them.
# 13:00 UTC is 8am Eastern during EDT (summer/fall) or 9am during EST
# (winter) -- close enough either way that "Tuesday morning" holds all
# season. Adjust the cron below if a different time is wanted.
#
# Also runnable by hand any time from the Actions tab (workflow_dispatch),
# e.g. to force a refresh right after fixing something.
on:
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit the updated JSON back to the repo

jobs:
  update-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Pull current Sleeper season into data/history/
        run: python export_sleeper_season.py

      - name: Regenerate facts.json across all seasons
        # Every path spelled out explicitly here -- this repo keeps
        # manager_mapping.json and managers.json under data/, not at repo
        # root, so the script's own built-in defaults don't match and
        # can't be relied on.
        run: >
          python generate_facts.py
          --data-dir data/history
          --mapping data/manager_mapping.json
          --managers data/managers.json
          --out data/facts.json

      - name: Compute power scores and playoff/bye/championship odds
        # Deliberately allowed to fail without blocking the rest of the
        # pipeline: this is newer and rides on an undocumented Sleeper
        # endpoint (see the module docstring in compute_power_stats.py),
        # unlike everything above it. A bad week here should mean a gap
        # in power_log.json (visible, honest, and consistent with "can't
        # be recomputed retroactively" -- see the log's overwrite-refusal
        # logic) -- not a missed facts.json/feed update for the whole
        # league over something unrelated.
        continue-on-error: true
        run: python compute_power_stats.py

      - name: Generate matchup storylines for the upcoming week
        # Same isolation reasoning as the power-stats step -- also rides
        # on the undocumented projections endpoint (for roster_strength),
        # and is newer/less proven than the facts pipeline above it.
        continue-on-error: true
        run: python generate_matchup_storylines.py

      - name: Render matchup previews to readable prose
        # Unlike power_log.json, this step is safe to simply regenerate --
        # it's a pure function of the storylines file plus team_flavor.json/
        # rivalry_lore.json, not a point-in-time snapshot that can't be
        # recreated. No overwrite-refusal needed here on purpose.
        continue-on-error: true
        run: python render_matchup_previews.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Exclude the shared players cache (data/.players_cache.json) --
          # it's a scratch file for staying under Sleeper's once-a-day
          # /players/nfl ask, not something that belongs in version control.
          git add data/ ':!data/.players_cache.json'
          if git diff --staged --quiet; then
            echo "Nothing changed -- skipping commit."
          else
            git commit -m "Weekly facts update: $(date -u +%Y-%m-%d)"
            git push
          fi
